<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f4f4f4" rx="12"/>
  <rect x="20" y="20" width="360" height="360" fill="#ffffff" rx="8" stroke="#e0e0e0" stroke-width="2"/>
  <g transform="translate(100, 70)">
    <!-- Chain Handle -->
    <path d="M40 70 C40 10, 160 10, 160 70" fill="none" stroke="#d4af37" stroke-width="8" stroke-dasharray="8,4"/>
    <!-- Bag Body Quilted Pattern -->
    <rect x="20" y="70" width="160" height="130" rx="10" fill="#1a1a1a"/>
    <!-- Gold Clasp -->
    <rect x="90" y="125" width="20" height="15" rx="3" fill="#d4af37"/>
    <!-- Quilted Cross Lines -->
    <line x1="25" y1="90" x2="175" y2="190" stroke="#333" stroke-width="1.5"/>
    <line x1="25" y1="130" x2="150" y2="200" stroke="#333" stroke-width="1.5"/>
    <line x1="175" y1="90" x2="25" y2="190" stroke="#333" stroke-width="1.5"/>
    <line x1="175" y1="130" x2="50" y2="200" stroke="#333" stroke-width="1.5"/>
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111" text-anchor="middle">TÚI THỜI TRANG DA CÁ SẤU</text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">Da dập vân chần trám cao cấp</text>
</svg>
