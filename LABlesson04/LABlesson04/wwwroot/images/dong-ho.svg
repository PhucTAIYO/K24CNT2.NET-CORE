<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8f9fa" rx="12"/>
  <rect x="20" y="20" width="360" height="360" fill="#ffffff" rx="8" stroke="#e9ecef" stroke-width="2"/>
  <g transform="translate(150, 60)">
    <!-- Watch Straps -->
    <rect x="30" y="0" width="40" height="70" fill="#343a40" rx="4"/>
    <rect x="30" y="150" width="40" height="70" fill="#343a40" rx="4"/>
    <!-- Watch Case -->
    <circle cx="50" cy="110" r="55" fill="#f1f3f5" stroke="#adb5bd" stroke-width="8"/>
    <circle cx="50" cy="110" r="45" fill="#212529"/>
    <!-- Watch Hands -->
    <line x1="50" y1="110" x2="50" y2="80" stroke="#ffc107" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="110" x2="75" y2="110" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="50" cy="110" r="4" fill="#ffc107"/>
  </g>
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">ĐỒNG HỒ CAO CẤP</text>
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="14" fill="#6c757d" text-anchor="middle">Chống nước 5 ATM, mặt kính sapphire</text>
</svg>
